<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Users – Admin</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />
  <style>
    /* Basic CSS for selected row and button styling */
    #usersTable tbody tr {
      cursor: pointer; /* Indicate rows are clickable */
    }
    #usersTable tbody tr.selected {
      background-color: #e0f7fa; /* Light blue for selected row */
      border: 1px solid #00bcd4;
    }
    .action-buttons-container {
      margin-top: 20px;
      display: flex; /* Arrange buttons side-by-side */
      gap: 10px; /* Space between buttons */
    }
    .action-button-global {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      opacity: 0.7; /* Slightly dim when disabled */
    }
    .action-button-global:enabled {
      opacity: 1; /* Full opacity when enabled */
    }
    #deleteSelectedUserBtn {
      background-color: #dc3545; /* Red */
      color: white;
    }
    #toggleAdminSelectedUserBtn {
      background-color: #007bff; /* Blue */
      color: white;
    }
    #toggleAdminSelectedUserBtn.is-admin {
        background-color: #ffc107; /* Yellow when "Remove Admin" */
        color: #333;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1><a href="admin.html">Admin Dashboard</a></h1>
    <div class="icons">
      <a href="#" id="logoutLink">Logout</a>
      <a href="admin.html">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <h2>Manage Users</h2>
    <div class="table-responsive">
      <table id="usersTable" class="data-table">
        <colgroup>
          <col style="width:5%;" />
          <col style="width:12%;" />
          <col style="width:20%;" />
          <col style="width:8%;" />
          <col style="width:8%;" />
          <col style="width:8%;" />
          <col style="width:8%;" />
          <col style="width:10%;" />
          <col style="width:8%;" />
        </colgroup>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
            <th>State</th>
            <th>ZIP</th>
            <th>Promo</th>
            <th>Status</th>
            <th>Admin</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

    <div class="action-buttons-container">
      <button id="deleteSelectedUserBtn" class="action-button-global" disabled>Delete Selected User</button>
      <button id="toggleAdminSelectedUserBtn" class="action-button-global" disabled>Make Admin</button>
    </div>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/admin_users.js"></script>
</body>
</html>
