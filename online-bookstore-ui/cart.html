<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Your Shopping Cart</title>
  <link rel="stylesheet" href="css/styles.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
        <a href="cart.html" id="cartLink">
            <i class="fas fa-shopping-cart"></i>
            Cart (<span id="cartCount">0</span>)
        </a>
        <a href="login.html" id="loginLink">Login</a>
        <a href="#" id="logoutLink" style="display:none;">Logout</a>
        <a href="register.html" id="registerLink">Register</a>
        <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="order_history.html" id="orderHistoryLink" style="display:none;">Order History</a> <!-- New: Order History link -->
        <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
        <a href="admin.html" id="adminDashboardLink" style="display:none;">
            <i class="fas fa-user-shield"></i> Dashboard
        </a>
    </div>
</nav>

  <div class="container">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal:</span>
        <span id="subtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Tax (7%):</span>
        <span id="tax">$0.00</span>
      </div>
      <div class="summary-row total">
        <span>Total:</span>
        <span id="total">$0.00</span>
      </div>
      <button onclick="window.location.href='checkout.html'" class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  
  <script src="js/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateNav();
      displayCartItems();
    });

    async function displayCartItems() {
      const container = document.getElementById('cartItems');
      const subtotalEl = document.getElementById('subtotal');
      const taxEl = document.getElementById('tax');
      const totalEl = document.getElementById('total');
      
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      container.innerHTML = '';
      
      if (cart.length === 0) {
        container.innerHTML = '<p>Your Cart Is Empty.</p>';
        subtotalEl.textContent = '$0.00';
        taxEl.textContent = '$0.00';
        totalEl.textContent = '$0.00';
        return;
      }
      
      let subtotal = 0;
      
      for (const item of cart) {
        const div = document.createElement('div');
        div.className = 'cart-item';
        
        const img = document.createElement('img');
        img.src = item.image || 'assets/book_images/default.jpg';
        img.alt = item.title;
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'item-info';
        
        const title = document.createElement('h3');
        title.textContent = item.title;
        
        const price = document.createElement('p');
        price.textContent = `$${item.price.toFixed(2)}`;
        
        const quantityDiv = document.createElement('div');
        quantityDiv.className = 'quantity-control';
        
        const minusBtn = document.createElement('button');
        minusBtn.textContent = '-';
        minusBtn.onclick = () => updateQuantity(item.id, -1);
        
        const quantity = document.createElement('span');
        quantity.textContent = item.quantity;
        
        const plusBtn = document.createElement('button');
        plusBtn.textContent = '+';
        plusBtn.onclick = () => updateQuantity(item.id, 1);
        
        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.className = 'remove-btn';
        removeBtn.onclick = () => removeFromCart(item.id);
        
        quantityDiv.appendChild(minusBtn);
        quantityDiv.appendChild(quantity);
        quantityDiv.appendChild(plusBtn);
        
        infoDiv.appendChild(title);
        infoDiv.appendChild(price);
        infoDiv.appendChild(quantityDiv);
        
        div.appendChild(img);
        div.appendChild(infoDiv);
        div.appendChild(removeBtn);
        
        container.appendChild(div);
        
        subtotal += item.price * item.quantity;
      }
      
      const tax = subtotal * 0.07;
      const total = subtotal + tax;
      
      subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
      taxEl.textContent = `$${tax.toFixed(2)}`;
      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    function updateQuantity(bookId, change) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const item = cart.find(item => item.id === bookId);
      
      if (item) {
        item.quantity += change;
        
        if (item.quantity <= 0) {
          cart = cart.filter(item => item.id !== bookId);
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        displayCartItems();
      }
    }

    function removeFromCart(bookId) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart = cart.filter(item => item.id !== bookId);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      displayCartItems();
    }
  </script>
</body>
</html>
