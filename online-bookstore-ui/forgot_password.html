<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="login.html" id="loginLink">Login</a>

      <a href="#" id="logoutLink" style="display:none;">Logout</a>

      <a href="register.html" id="registerLink">Register</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">
        <i class="fas fa-user-shield"></i> Dashboard
      </a>
    </div>
  </nav>

  <div class="container">
    <form id="forgotForm">
      <h2>Forgot Password</h2>
      <div class="form-group">
        <label for="fpEmail">Email</label>
        <input id="fpEmail" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="submit-btn">Send Reset Link</button>
    </form>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = e.target.email.value;
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const { message } = await res.json();
        alert(message);
        window.location.href = 'login.html';
      } catch (err) {
        alert('Request failed. Please try again.');
      }
    });
  </script>
</body>
</html>
