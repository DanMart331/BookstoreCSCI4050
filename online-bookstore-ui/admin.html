<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard – Online Bookstore</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pQ6J6Q3LtqvV4olUlk4F3nXbVvOaK+5fQeL+XJmC4yj8s7VSTVYBfB2M0y9UoFU/2+vH0hZfu/2eQZw8lW+J1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>
    <input id="searchBar" type="text" placeholder="Search..." />
    <select id="genreFilter">
      <option value="">All Genres</option>
      <option value="fiction">Fiction</option>
      <option value="science fiction">Science Fiction</option>
      <option value="fantasy">Fantasy</option>
      <option value="mystery">Mystery</option>
    </select>
    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i> Cart (<span id="cartCount">0</span>)
      </a>
      <a href="register.html" id="registerLink">Register</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">
        <i class="fas fa-user-shield"></i> Dashboard
      </a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
    </div>
  </nav>

  <div class="container">
    <h2>Admin Dashboard</h2>
    <div class="admin-menu">
      <div class="admin-card">
        <h3>Manage Books</h3>
        <p>Add, edit, or remove books from the store</p>
        <button onclick="window.location.href='admin_books.html'">Go to Books</button>
      </div>
      <div class="admin-card">
        <h3>Manage Users</h3>
        <p>View and manage customer accounts</p>
        <button onclick="window.location.href='admin_users.html'">Go to Users</button>
      </div>
    </div>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      if (!user?.is_admin) {
        alert('Admin access only');
        window.location.href = 'admin_login.html';
      }
    });
  </script>
</body>
</html>
