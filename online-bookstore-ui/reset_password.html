<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">…</a>
      <a href="register.html" id="registerLink">Register</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">
        <i class="fas fa-user-shield"></i> Dashboard
      </a>
    </div>
  </nav>
  
  <div class="container">
    <form id="resetForm">
      <h2>Reset Your Password</h2>
      <div class="form-group">
        <label for="newPass">New Password</label>
        <input id="newPass" name="password" type="password" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label for="confirmPass">Confirm Password</label>
        <input id="confirmPass" type="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="submit-btn">Set New Password</button>
    </form>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    if (!token) {
      alert('Invalid reset link.');
      window.location.href = 'login.html';
    }

    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pass = e.target.password.value;
      const confirm = document.getElementById('confirmPass').value;
      if (pass !== confirm) {
        return alert('Passwords do not match.');
      }
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pass })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert(data.message);
        window.location.href = 'login.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
