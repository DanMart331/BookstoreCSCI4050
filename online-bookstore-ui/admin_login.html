<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login – Online Bookstore</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>
    <input id="searchBar" type="text" placeholder="Search..." />
    <select id="genreFilter">
      <option value="">All Genres</option>
      <option value="fiction">Fiction</option>
      <option value="science fiction">Science Fiction</option>
      <option value="fantasy">Fantasy</option>
      <option value="mystery">Mystery</option>
    </select>
    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i> Cart (<span id="cartCount">0</span>)
      </a>
      <a href="register.html"   id="registerLink">Register</a>
      <a href="login.html"      id="loginLink">Login</a>
      <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
      <a href="order_history.html" id="orderHistoryLink" style="display:none;">Order History</a>
      <a href="admin.html"      id="adminDashboardLink" style="display:none;">
        <i class="fas fa-user-shield"></i> Dashboard
      </a>
      <a href="#"               id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
    </div>
  </nav>

  <div class="container">
    <form id="adminLoginForm">
      <h2>Admin Login</h2>
      <div class="form-group">
        <label for="adminEmail">Email</label>
        <input id="adminEmail" name="email" type="email" placeholder="admin@bookstore.com" required />
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" required />
      </div>
      <button type="submit" class="submit-btn">Login as Admin</button>
    </form>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
