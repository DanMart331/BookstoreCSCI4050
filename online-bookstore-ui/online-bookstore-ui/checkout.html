<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>
    <input type="text" placeholder="Search...">
    <div class="icons">
      <a href="login.html" id="loginLink">Login</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
    </div>
  </nav>

  <div class="container">
    <form id="checkoutForm">
      <h2>Checkout</h2>
      
      <div class="form-section">
        <h3>Shipping Information</h3>
        <div class="form-group">
          <label for="shippingName">Full Name</label>
          <input type="text" id="shippingName" name="shippingName" required>
        </div>
        <div class="form-group">
          <label for="shippingStreet">Street Address</label>
          <input type="text" id="shippingStreet" name="shippingStreet" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="shippingCity">City</label>
            <input type="text" id="shippingCity" name="shippingCity" required>
          </div>
          <div class="form-group">
            <label for="shippingState">State</label>
            <input type="text" id="shippingState" name="shippingState" required>
          </div>
          <div class="form-group">
            <label for="shippingZip">ZIP Code</label>
            <input type="text" id="shippingZip" name="shippingZip" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Payment Information</h3>
        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cardExp">Expiration Date</label>
            <input type="text" id="cardExp" name="cardExp" placeholder="MM/YY" required>
          </div>
          <div class="form-group">
            <label for="cardCvv">CVV</label>
            <input type="text" id="cardCvv" name="cardCvv" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Order Summary</h3>
        <div id="checkoutSummary" class="checkout-summary"></div>
      </div>

      <button type="submit" class="submit-btn">Place Order</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateNav();
      loadCheckoutSummary();
      
      const user = JSON.parse(localStorage.getItem('user'));
      if (user) {
        // In a real app, we would fetch user's saved addresses and payment methods
        document.getElementById('shippingName').value = user.name || '';
      }

      document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
          alert('Your cart is empty.');
          return;
        }
        
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const tax = subtotal * 0.07;
        const total = subtotal + tax;
        
        const order = {
          cart: cart,
          subtotal: subtotal.toFixed(2),
          tax: tax.toFixed(2),
          total: total.toFixed(2),
          shipping: {
            name: e.target.shippingName.value,
            street: e.target.shippingStreet.value,
            city: e.target.shippingCity.value,
            state: e.target.shippingState.value,
            zip: e.target.shippingZip.value
          },
          payment: {
            cardNumber: e.target.cardNumber.value.slice(-4),
            cardExp: e.target.cardExp.value
          },
          date: new Date().toLocaleString()
        };
        
        localStorage.setItem('lastOrder', JSON.stringify(order));
        
        // In a real app, we would send this to the server
        const history = JSON.parse(localStorage.getItem('orderHistory')) || [];
        history.push(order);
        localStorage.setItem('orderHistory', JSON.stringify(history));
        localStorage.removeItem('cart');
        
        window.location.href = 'order_summary.html';
      });
    });

    function loadCheckoutSummary() {
      const container = document.getElementById('checkoutSummary');
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      
      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        return;
      }
      
      let subtotal = 0;
      let html = '<table><thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th></tr></thead><tbody>';
      
      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        
        html += `
          <tr>
            <td>${item.title}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>${item.quantity}</td>
            <td>$${itemTotal.toFixed(2)}</td>
          </tr>
        `;
      });
      
      const tax = subtotal * 0.07;
      const total = subtotal + tax;
      
      html += `</tbody></table>
        <div class="summary-totals">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div class="summary-row">
            <span>Tax (7%):</span>
            <span>$${tax.toFixed(2)}</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span>$${total.toFixed(2)}</span>
          </div>
        </div>
      `;
      
      container.innerHTML = html;
    }
  </script>
</body>
</html>
