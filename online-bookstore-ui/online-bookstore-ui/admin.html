<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>
    <div class="icons">
      <a href="index.html">View Store</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h2>Admin Dashboard</h2>
    
    <div class="admin-menu">
      <div class="admin-card">
        <h3>Manage Books</h3>
        <p>Add, edit, or remove books from the store</p>
        <button onclick="window.location.href='admin_books.html'">Go to Books</button>
      </div>
      
      <div class="admin-card">
        <h3>Manage Users</h3>
        <p>View and manage customer accounts</p>
        <button onclick="window.location.href='admin_users.html'">Go to Users</button>
      </div>
      
      <div class="admin-card">
        <h3>Manage Promotions</h3>
        <p>Create and manage special offers</p>
        <button onclick="window.location.href='admin_promotions.html'">Go to Promotions</button>
      </div>
      
      <div class="admin-card">
        <h3>View Reports</h3>
        <p>Sales and inventory reports</p>
        <button onclick="window.location.href='admin_reports.html'">Go to Reports</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // In a real app, we would check admin authentication here
      document.getElementById('logoutLink').onclick = () => {
        localStorage.removeItem('adminToken');
        window.location.href = 'index.html';
      };
    });
  </script>
</body>
</html>
