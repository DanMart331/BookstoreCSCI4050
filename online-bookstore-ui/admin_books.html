<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Books – Admin</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="admin.html">Admin Dashboard</a></h1>
    <div class="icons">
      <a href="#" id="logoutLink">Logout</a>
      <a href="admin.html">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <h2>Manage Books</h2>
    <button id="newBookBtn" class="submit-btn">+ Add New Book</button>

    <div class="table-responsive">
      <table id="booksTable" class="data-table">
        <colgroup>
          <col style="width: 10%;" />
          <col style="width: 25%;" />
          <col style="width: 20%;" />
          <col style="width: 20%;" />
          <col style="width: 10%;" />
          <col style="width: 10%;" />
          <col style="width: 10%;" />
          <col style="width: 22%;" />
        </colgroup>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
            <th>Price</th>
            <th>Featured</th>
            <th>Coming Soon</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
    </div>
  </div>

  <div id="bookModal" class="modal" hidden>
    <div class="modal-content">
      <h3 id="modalTitle">New Book</h3>
      <span class="close">&times;</span>
      <form id="bookForm">
        <input type="hidden" id="bookId" />
        <div class="form-group">
          <label for="title">Title</label>
          <input id="title" required />
        </div>
        <div class="form-group">
          <label for="author">Author</label>
          <input id="author" required />
        </div>
        <div class="form-group">
          <label for="genre">Genre</label>
          <input id="genre" required />
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input id="price" type="number" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="image">Image URL</label>
          <input id="image" />
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="featured" /> Featured</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="comingSoon" /> Coming Soon</label>
        </div>
        <button type="submit" class="submit-btn">Save</button>
      </form>
    </div>
  </div>

  <script src="js/admin_books.js"></script>
  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
