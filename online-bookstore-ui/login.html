<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login – Online Bookstore</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
      <a href="cart.html" id="cartLink" style="display: none;">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="register.html" id="registerLink">Register</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="order_history.html" id="orderHistoryLink" style="display:none;">Order History</a>
      <a href="admin_login.html" id="adminLoginLink">Admin Login</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">
        <i class="fas fa-user-shield"></i> Dashboard
      </a>
    </div>
  </nav>

  <div class="container">
    <form id="loginForm">
      <h2>Login to Your Account</h2>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group">
        <label>
          <input id="rememberMe" name="rememberMe" type="checkbox" />
          Remember me
        </label>
      </div>

      <button type="submit" class="submit-btn">Login</button>

      <div
        class="form-row"
        style="justify-content: space-between; margin-top: 10px;"
      >
        <a href="forgot_password.html">Forgot Password?</a>
        <a href="register.html">Sign Up</a>
      </div>
    </form>
  </div>

  <script src="js/apiService.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
