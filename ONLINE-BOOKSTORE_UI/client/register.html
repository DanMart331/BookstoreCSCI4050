<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register – Online Bookstore</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pQ6J6Q3LtqvV4olUlk4F3nXbVvOaK+5fQeL+XJmC4yj8s7VSTVYBfB2M0y9UoFU/2+vH0hZfu/2eQZw8lW+J1w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>
    <input id="searchBar" type="text" placeholder="Search..." />
    <select id="genreFilter">
      <option value="">All Genres</option>
      <option value="fiction">Fiction</option>
      <option value="science fiction">Science Fiction</option>
      <option value="fantasy">Fantasy</option>
      <option value="mystery">Mystery</option>
    </select>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="register.html" id="registerLink">Register</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
    </div>
  </nav>

  <div class="container">
  <form id="registerForm">
    <h2>Create Your Account</h2>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="John Doe"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="you@example.com"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="••••••••"
        required
      />
    </div>

    <div class="form-group">
      <label for="street">Street</label>
      <input
        id="street"
        name="street"
        type="text"
        placeholder="123 Main St"
        required
      />
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input
        id="city"
        name="city"
        type="text"
        placeholder="Atlanta"
        required
      />
    </div>

    <div class="form-group">
      <label for="state">State</label>
      <input
        id="state"
        name="state"
        type="text"
        placeholder="GA"
        required
      />
    </div>

    <div class="form-group">
      <label for="zip">ZIP Code</label>
      <input
        id="zip"
        name="zip"
        type="text"
        placeholder="30301"
        required
      />
    </div>

    <div class="form-group">
      <label for="card_number">Card Number</label>
      <input
        id="card_number"
        name="card_number"
        type="text"
        placeholder="1234 5678 9012 3456"
        required
      />
    </div>

    <div class="form-group">
      <label for="card_exp">Card Expiry</label>
      <input
        id="card_exp"
        name="card_exp"
        type="text"
        placeholder="MM/YY"
        required
      />
    </div>

    <div class="form-group">
      <label for="card_cvv">CVV</label>
      <input
        id="card_cvv"
        name="card_cvv"
        type="text"
        placeholder="123"
        required
      />
    </div>

    <div class="form-group">
      <label>
        <input
          id="promotion_opt_in"
          name="promotion_opt_in"
          type="checkbox"
        />
        Receive promotions and updates
      </label>
    </div>

    <button type="submit" class="submit-btn">Create Account</button>

    <div
      class="form-row"
      style="justify-content: space-between; margin-top: 10px;"
    >
      <p style="margin-top: 10px; text-align: center;">
  Have an account already? <a href="login.html">Login</a>
</p>
    </div>
  </form>
</div>
