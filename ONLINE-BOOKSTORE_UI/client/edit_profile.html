<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
    </div>
  </nav>

  <form id="editProfileForm">
    <h2>Edit Profile</h2>
    
    <h3>Personal Info</h3>
    <input id="name" name="name" placeholder="Full Name">
    <input id="email" name="email" placeholder="Email" disabled>

    <h3>Change Password</h3>
    <input id="oldPassword" type="password" placeholder="Old Password" disabled>
    <input id="newPassword" type="password" placeholder="New Password">

    <h3>Address</h3>
    <input id="street" name="street" placeholder="Street">
    <input id="city" name="city" placeholder="City">
    <input id="state" name="state" placeholder="State">
    <input id="zip" name="zip" placeholder="ZIP">

    <h3>Payment Info</h3>
    <input id="card_number" name="card_number" placeholder="Card Number">
    <input id="card_exp" name="card_exp" placeholder="Expiration">
    <input id="card_cvv" name="card_cvv" placeholder="CVV">

    <label>
      <input id="promotion_opt_in" type="checkbox"> Receive promotions
    </label>

    <button type="submit">Save Changes</button>
  </form>
  <script src="/js/apiService.js"></script>
  <script src="/js/scripts.js"></script>
</body>
</html>
