<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Bookstore</title>

  <link rel="stylesheet" href="css/styles.css">
<!-- We Got Styles and Fonts From FontAwesome-->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />

  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <input id="searchBar" type="text" placeholder="Search by title, author, or genre...">
    <select id="genreFilter">
      <option value="">All Genres</option>
      <option value="fiction">Fiction</option>
      <option value="science fiction">Science Fiction</option>
      <option value="fantasy">Fantasy</option>
      <option value="mystery">Mystery</option>
    </select>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="login.html" id="loginLink">Login</a>

      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">…</a>

      <a href="register.html" id="registerLink">Register</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">
        <i class="fas fa-user-shield"></i>
        Admin
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="api-status">
      <span id="apiStatus">Loading books...</span>
    </div>

    <h2>Featured Books</h2>
    <div id="featuredBooks" class="book-grid"></div>

    <h2>Coming Soon</h2>
    <div id="comingSoonBooks" class="book-grid"></div>
  </div>

  <div id="apiErrorModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Service Notice</h3>
      <p id="apiErrorText"></p>
    </div>
  </div>

  <script src="/js/apiService.js"></script>
  <script src="/js/scripts.js"></script>
</body>
</html>
