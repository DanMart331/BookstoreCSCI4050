<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order History</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <h1><a href="index.html">Online Bookstore</a></h1>

    <div class="icons">
      <a href="cart.html" id="cartLink">
        <i class="fas fa-shopping-cart"></i>
        Cart (<span id="cartCount">0</span>)
      </a>
      <a href="login.html" id="loginLink">Login</a>

      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">…</a>

      <a href="register.html" id="registerLink">Register</a>
      <a href="edit_profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="admin.html" id="adminLink" style="display:none;">
        <i class="fas fa-user-shield"></i>
        Admin
      </a>
    </div>
  </nav>

  <div class="container">
    <h2>Your Order History</h2>
    <div id="history" class="order-history"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/scripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateNav();
      loadOrderHistory();
    });

    function loadOrderHistory() {
      const history = JSON.parse(localStorage.getItem('orderHistory')) || [];
      const container = document.getElementById('history');
      
      if (history.length === 0) {
        container.innerHTML = '<p>You Have No Past Orders.</p>';
        return;
      }
      
      container.innerHTML = '';
      
      history.reverse().forEach((order, index) => {
        const orderCard = document.createElement('div');
        orderCard.className = 'order-card';
        
        let itemsHtml = '';
        order.cart.forEach(item => {
          itemsHtml += `
            <div class="order-item">
              <img src="${item.image || 'assets/book_images/default.jpg'}" alt="${item.title}">
              <div class="order-item-info">
                <h4>${item.title}</h4>
                <p>$${item.price.toFixed(2)} × ${item.quantity}</p>
              </div>
            </div>
          `;
        });
        
        orderCard.innerHTML = `
          <div class="order-header">
            <h3>Order #${history.length - index}</h3>
            <p>${order.date}</p>
          </div>
          <div class="order-items">${itemsHtml}</div>
          <div class="order-total">
            <p>Total: $${order.total}</p>
            <button onclick="reorder(${index})">Reorder</button>
          </div>
        `;
        
        container.appendChild(orderCard);
      });
    }

    function reorder(index) {
      const history = JSON.parse(localStorage.getItem('orderHistory')) || [];
      const order = history.reverse()[index];
      
      if (order && order.cart) {
        localStorage.setItem('cart', JSON.stringify(order.cart));
        window.location.href = 'cart.html';
      }
    }
  </script>
</body>
</html>
